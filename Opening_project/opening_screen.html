<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href= "opening_screen.css" rel="stylesheet" type="text/css">
    <title>Love Triangle</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<body>

<div id="page">

    <div id="background"></div>
    
    <div class="navigation">
        <h2 id="team-name">Love Triangle</h2>

            <div class="nav-tab" id="How-to-Play">How to Play</div>
            <div class="nav-tab" id="Feedback">Feedback</div>
        </div>
    </div>

    <div id="opening">

        <div class="sprite" id="sprite1">
            <div class="info"
                <h3> HTML </h3>
                <p> Short bio </p>
            </div>
            <img src="../images/htmldefault.png" alt="HTML" draggable="false">
        </div>
        
        <div id="center-screen">
            <div id="title-circle">
                <h1>Title</h1>
            </div>

            <button id="start-button">Start</button>
            
        </div>
        
        <div class="sprite" id="sprite2">
            <div class="info"
                <h3> CSS </h3>
                <p> Short bio </p>
            </div>
            <img src="../images/cssdefault.png" alt="CSS" draggable="false">
        </div>

    </div>


</div>
