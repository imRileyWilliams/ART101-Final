<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href= "opening_screen.css" rel="stylesheet" type="text/css">
    <title>Love Triangle</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="opening_screen.js" defer></script>
    
</head>

<body>

<div class="navigation">
    <h2 id="team-name">Love Triangle</h2>
    <div class="nav-tabs">
        <div class="nav-tab" id="about">About</div>
        <div class="nav-tab" id="how-to-play">How to Play</div>
        <div class="nav-tab" id="the-team">The Team</div>
    </div>
</div>
    
<div id="page">

    <div id="background">
    </div>
    <div id="opening">

        <div class="sprite" id="sprite1">
            <div class="info1">
                <h3> HTML </h3>
                <p> Short bio </p>
            </div>
            <img src="../images/htmldefault.png" alt="HTML">
        </div>
        
        <div id="center-screen">
            <div id="title-circle">
                <h1>Title</h1>
            </div>

            <button id="start-button">Start</button>
            
        </div>
        
        <div class="sprite" id="sprite2">
            <div class="info2">
                <h3> CSS </h3>
                <p> Short bio </p>
            </div>
            <img src="../images/cssdefault.png" alt="CSS">
        </div>

    </div>

</div>

<div id="novel" hidden>
    <p> loading the visual novel</p>
</div>

<div class ="page" id="about-page">
    <h2>About</h2>
    <p> about the game</p>
</div>

<div class ="page" id="how-to-play-page">
    <h2>How to Play</h2>
    <p> instructions for playing the game</p>
</div>

<div class ="page" id="the-team-page">
    <h2>The Team</h2>
    <p> information about the developers</p>
</div>

</body>

</html>
